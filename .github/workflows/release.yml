name: Release

# Versioning is managed with commitizen: run `cz bump` locally (it updates
# VERSION, the package.json files and CHANGELOG.md, then creates an annotated
# v<version> tag) and push with `git push --follow-tags`. Pushing the tag
# publishes the GitHub release; docker-build.yml publishes the images.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Check tag matches VERSION
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$(cat VERSION)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          uvx --from commitizen cz changelog "$VERSION" --dry-run > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<NOTES

          ### Docker images

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}/backend:${VERSION}
          docker pull ghcr.io/${{ github.repository }}/frontend:${VERSION}

          # Or with docker compose
          cd docker
          IMAGE_TAG=${VERSION} docker compose up -d
          \`\`\`
          NOTES
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
